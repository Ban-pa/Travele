[project]
name = "travele"
version = "0.1.0"
description = "智能旅行规划应用（Travele）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "mcp>=2.2.0",
    "mcp-server-12306>=0.5.0.post20260822",
    "pydantic-settings>=2.15.0",
    "sentence-transformers>=6.0.1",
    "streamlit>=1.63.0",
]

# 本项目是"应用"不是"库"：不构建/安装本地包（代码以 Travele/ 包形式被导入）
[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
